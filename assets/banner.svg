<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">SkillDelta — A skill is a hypothesis. Test it.</title>
  <desc id="desc">Compare coding outcomes with and without a skill using executable tests. A stylized delta symbol and two comparison bars illustrate the concept without claiming benchmark results.</desc>
  <defs><linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d0f586" stop-opacity=".12"/><stop offset="1" stop-color="#d0f586" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d0f586" stroke-opacity=".045"/></pattern></defs>
  <rect width="1280" height="480" rx="18" fill="#101211"/>
  <rect width="1280" height="480" rx="18" fill="url(#grid)"/>
  <circle cx="1120" cy="100" r="380" fill="url(#glow)"/>
  <path d="M80 48 99 82H61L80 48Z" stroke="#d0f586" stroke-width="3" fill="none"/><path d="m72 76 8-15 8 15" stroke="#d0f586" stroke-width="3" fill="none"/>
  <text x="114" y="78" fill="#f1f2e8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-1">SkillDelta</text>
  <text x="64" y="160" fill="#a2aa9e" font-family="monospace" font-size="12" letter-spacing="3">EXECUTABLE EVIDENCE FOR AGENT SKILLS</text>
  <text x="60" y="235" fill="#f1f2e8" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">A skill is a hypothesis.</text>
  <text x="60" y="310" fill="#d0f586" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">Test it.</text>
  <text x="64" y="368" fill="#a2aa9e" font-family="Arial,Helvetica,sans-serif" font-size="19">Same tasks. With and without the skill. Real tests.</text>
  <path d="M64 410H1216" stroke="#32382e"/>
  <text x="64" y="447" fill="#a2aa9e" font-family="monospace" font-size="12">PAIRED TRIALS</text><text x="235" y="447" fill="#a2aa9e" font-family="monospace" font-size="12">PORTABLE REPORTS</text><text x="434" y="447" fill="#a2aa9e" font-family="monospace" font-size="12">NO RUNTIME DEPENDENCIES</text>
  <rect x="874" y="120" width="342" height="248" rx="14" fill="#191c19" stroke="#32382e"/>
  <text x="899" y="155" fill="#a2aa9e" font-family="monospace" font-size="10" letter-spacing="2">COMPARE THE OUTCOME</text>
  <text x="899" y="205" fill="#aaa0ff" font-family="monospace" font-size="12">WITHOUT SKILL</text><rect x="899" y="220" width="292" height="8" rx="4" fill="#32382e"/><rect x="899" y="220" width="122" height="8" rx="4" fill="#aaa0ff"/>
  <text x="899" y="270" fill="#d0f586" font-family="monospace" font-size="12">WITH SKILL</text><rect x="899" y="285" width="292" height="8" rx="4" fill="#32382e"/><rect x="899" y="285" width="224" height="8" rx="4" fill="#d0f586"/>
  <text x="899" y="339" fill="#a2aa9e" font-family="monospace" font-size="10">ILLUSTRATION · NOT BENCHMARK DATA</text>
</svg>
